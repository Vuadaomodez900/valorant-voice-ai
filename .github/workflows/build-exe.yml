name: Build Windows Standalone Executable (.exe)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build ValorantVoiceAI.exe on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run Environment Diagnostic Check
        run: |
          python scripts/check_env.py

      - name: Build Standalone Executable with PyInstaller
        run: |
          pyinstaller build.spec --clean --noconfirm

      - name: Verify Build Output
        shell: pwsh
        run: |
          if (Test-Path "dist/ValorantVoiceAI.exe") {
            Write-Host "SUCCESS: dist/ValorantVoiceAI.exe was built successfully!"
            Get-Item "dist/ValorantVoiceAI.exe" | Format-List Length, Name
          } else {
            Write-Error "ERROR: dist/ValorantVoiceAI.exe not found!"
            exit 1
          }

      - name: Package Distributable Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist/ValorantVoiceAI.exe release/
          Copy-Item config.yaml release/
          Copy-Item README.md release/
          Compress-Archive -Path release/* -DestinationPath ValorantVoiceAI-Windows-x64.zip -Force

      - name: Upload Build Artifact (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: ValorantVoiceAI-Windows-x64
          path: |
            dist/ValorantVoiceAI.exe
            config.yaml
            README.md
            ValorantVoiceAI-Windows-x64.zip
          retention-days: 14
