name: Build Windows Standalone Executable (.exe)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build ValorantVoiceAI.exe on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run Environment Diagnostic Check
        run: |
          python scripts/check_env.py

      - name: Build Standalone Executable with PyInstaller
        run: |
          pyinstaller build.spec --clean --noconfirm

      - name: Verify Build Output
        shell: bash
        run: |
          if [ -f "dist/ValorantVoiceAI.exe" ]; then
            echo "SUCCESS: dist/ValorantVoiceAI.exe was built successfully!"
            ls -lh dist/ValorantVoiceAI.exe
          else
            echo "ERROR: dist/ValorantVoiceAI.exe not found!"
            exit 1
          fi

      - name: Package Distributable Release
        shell: bash
        run: |
          mkdir release
          cp dist/ValorantVoiceAI.exe release/
          cp config.yaml release/
          cp README.md release/
          cd release && 7z a ../ValorantVoiceAI-Windows-x64.zip *

      - name: Upload Build Artifact (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: ValorantVoiceAI-Windows-x64
          path: |
            dist/ValorantVoiceAI.exe
            config.yaml
            README.md
            ValorantVoiceAI-Windows-x64.zip
          retention-days: 14
